plugins {
    id 'com.android.application'
}

android {
    namespace 'de.steffen.klicktest'
    compileSdk 35

    defaultConfig {
        applicationId 'de.steffen.klicktest'
        // dispatchGesture (Klicks in anderen Apps) gibt es ab Android 7.0.
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    // Öffentlicher Entwicklungsschlüssel: spätere Test-APKs lassen sich darüber installieren.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
